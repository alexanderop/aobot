name: aobot

services:
  server:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: /data/aobot.db
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
    ports:
      - "3000:3000"
    volumes:
      - data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  otel-lgtm:
    image: grafana/otel-lgtm
    ports:
      - "3300:3000"

volumes:
  data:
