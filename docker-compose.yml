name: aobot

services:
  server:
    build: .
    depends_on:
      computer-image:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: /data/aobot.db
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      # Where a person's browser opens Grafana, for the audit page's trace links.
      GRAFANA_URL: http://localhost:3300
      COMPUTER_IMAGE: aobot-computer:dev
      # Per project, so the dev stack and `vp run verify` start their own computer side by side.
      COMPUTER_NAME: ${COMPOSE_PROJECT_NAME}-computer
      COMPUTER_NETWORK: ${COMPOSE_PROJECT_NAME}_computers
      # People sign in at the local Dex below. The browser reaches it on localhost, the server inside
      # Compose as dex; tokens are checked against the address the browser uses.
      PUBLIC_URL: http://localhost:3000
      OIDC_ISSUER: http://localhost:5556/dex
      OIDC_ISSUER_INTERNAL_URL: http://dex:5556/dex
      OIDC_CLIENT_ID: aobot
      OIDC_CLIENT_SECRET: aobot-dev-secret
      SIGNIN_ALLOWED_EMAIL_DOMAINS: example.com
      ADMIN_EMAILS: alice@example.com
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - data:/data
      # The Bots and their grants. Edit it and restart the server; no rebuild.
      - ./bots.yaml:/app/bots.yaml:ro
      # The rules every Bot action is judged by. Edit it and restart the server, like bots.yaml.
      - ./rules.yaml:/app/rules.yaml:ro
      # The server starts the computer itself. It runs as root, so it can use the socket on Linux too.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
      - computers
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  # Builds the image the server starts the computer from, then exits. Nothing runs from it here.
  computer-image:
    build:
      context: .
      dockerfile: apps/computer/Dockerfile
    image: aobot-computer:dev
    command: ["true"]
    network_mode: none
    healthcheck:
      disable: true

  # The local OIDC provider people sign in at: alice@example.com, bob@example.com and mallory@other.com,
  # each with the password "password". Only on the default network, so a Bot's computer cannot reach it.
  dex:
    image: ghcr.io/dexidp/dex:v2.46.0
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    environment:
      DEX_ISSUER: http://localhost:5556/dex
      AOBOT_CALLBACK: http://localhost:3000/auth/callback
      DEX_EXPAND_ENV: "false"
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro
    ports:
      - "127.0.0.1:5556:5556"
    networks:
      - default

  otel-lgtm:
    image: grafana/otel-lgtm
    ports:
      - "127.0.0.1:3300:3000"
    # A command on the computers network reaches Grafana too. As Admin, which the image makes everyone
    # by default, or as admin/admin, it could add a data source pointing at the computer and send /act
    # through it from the collector's address. A Viewer can still read traces, Explore included.
    environment:
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_VIEWERS_CAN_EDIT: "true"
    # On the computers network too, because the computer exports its spans here.
    networks:
      - default
      - computers

volumes:
  data:

# The computer joins only this network, which it shares with the server and the collector.
networks:
  computers: {}
