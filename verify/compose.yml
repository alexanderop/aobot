# Added on top of docker-compose.yml by `vp run verify`: the server talks to the scripted mock model.
# Its own host ports, so a verify run works while the dev stack holds 3000, 3300 and 5556.
services:
  server:
    environment:
      MODEL_PROVIDER: openai-compat
      MODEL_NAME: mock
      MODEL_API_KEY: mock
      MODEL_BASE_URL: http://mock-model:4010/v1
      # Only here, for the fixture page. The server refuses it in production.
      COMPUTER_ALLOW_PRIVATE_HOSTS: "true"
      GRAFANA_URL: http://localhost:3400
      PUBLIC_URL: http://localhost:3100
      OIDC_ISSUER: http://localhost:5656/dex
    ports: !override
      - "127.0.0.1:3100:3000"

  dex:
    environment:
      DEX_ISSUER: http://localhost:5656/dex
      AOBOT_CALLBACK: http://localhost:3100/auth/callback
    ports: !override
      - "127.0.0.1:5656:5556"

  otel-lgtm:
    ports: !override
      - "127.0.0.1:3400:3000"

  mock-model:
    build: .
    command: ["node", "verify/mock-model.ts"]
    # On loopback, so a scenario can script the turn (PUT /mock/script) and read what the model saw.
    ports:
      - "127.0.0.1:4110:4010"

  # Pages for the computer to open. Only the computer's network reaches it.
  fixture:
    build: .
    command: ["node", "verify/fixture.ts"]
    networks:
      - computers
