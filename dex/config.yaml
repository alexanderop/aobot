# The local OIDC provider for development and `vp run verify`, never for production. Dex's entrypoint
# renders this with gomplate, so each stack sets its own issuer and callback; DEX_EXPAND_ENV=false keeps
# Dex itself from reading the `$` of each password hash as a variable.
issuer: '{{ getenv "DEX_ISSUER" }}'

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true

enablePasswordDB: true

staticClients:
  - id: aobot
    name: aobot
    # Known to anyone who reads this file, like every password below: this provider is only local.
    secret: aobot-dev-secret
    redirectURIs:
      - '{{ getenv "AOBOT_CALLBACK" }}'

# Every password is "password".
staticPasswords:
  - email: alice@example.com
    username: Alice
    userID: 08a8684b-db88-4b73-90a9-3cd1661f5466
    hash: "$2a$10$hQ/9EKd0.mObexgob6rcguiOBEtw62eu04bSwQErIghrr.v5HzeMe"
  - email: bob@example.com
    username: Bob
    userID: 6d1c7b4a-3c0e-4f43-9e43-2f0a3c1e9b11
    hash: "$2a$10$hQ/9EKd0.mObexgob6rcguiOBEtw62eu04bSwQErIghrr.v5HzeMe"
  - email: mallory@other.com
    username: Mallory
    userID: 9b2e4b0e-1f6a-4a52-8d1e-7c0e3a5d2c22
    hash: "$2a$10$hQ/9EKd0.mObexgob6rcguiOBEtw62eu04bSwQErIghrr.v5HzeMe"
